# Who this service serves. An actor is ASSIGNED here, never asserted by
# anything that arrives from outside: a channel adapter hands over the
# native identity it has (a Telegram user id) and this file says whose it
# is. An identity with no entry here is not served.
#
# No secrets in this file, ever. It is a thing you commit. A chat id is
# an address, not a credential.

[actor.owner]
# No `agents` key: every agent in the roster. No ceilings: the package's
# own is the only one in force.

# Where this person can be reached. AN ACTOR IS A PERSON, NOT A SEAT --
# one entry per channel, and the allowance, the whitelist and the queue
# of pending questions stay the person's rather than multiplying with the
# doors. A question raised anywhere is delivered to every channel listed
# here, and an answer may come back on any of them.
#
# `kind` is any lower-case token; dvara never branches on which channel
# it names. `id` is whatever that channel calls this person -- a number
# is fine, and is stored and compared as text. One (kind, id) pair
# belongs to at most one actor, checked across this whole file at load.
#
# Uncomment and put your own Telegram user id here, then check it works
# before wiring a bot to anything:
#
#     dvara say --as telegram:8675309 --agent greeter "who are you?"
#
# With the entry in place, `dvara telegram --agent greeter` answers you
# and nobody else: an id that is not in this file gets silence, and the
# line naming it goes to the terminal where the owner can act on it.
#
# [[actor.owner.channel]]
# kind = "telegram"
# id   = 8675309

[actor.guest]
agents           = ["greeter", "scribe"]
permissions      = "read_only"   # served, but never woken up to approve
max_usd_per_turn = 0.02          # lower than the package's own $0.05
max_usd_per_day  = 0.10          # and only so many of those in a day
receipt          = "remaining"   # "$0.08 left today" under each answer

# `receipt` is what follows this person's answers, and it is two words
# rather than a yes/no because two readers want two different numbers.
# An owner watching a bill wants "cost" -- what the turn cost. A person
# on an allowance is deciding whether to ask the follow-up, and the only
# figure they can act on is what is LEFT. Omit the key for nothing at
# all, which is the default and what most people in a chat want.
#
# "remaining" needs a max_usd_per_day to be left OF, and says so at load
# if there is none. Under a provider that bills nothing -- Ollama -- both
# kinds render nothing, because a meter that cannot move is a line under
# every answer forever, metering nothing.

# `permissions` is a rung on the ladder in gate.py and it can only ever
# TIGHTEN: the mode a turn runs under is the minimum of the package's,
# the owner's and this one. Writing "yolo" beside a guest grants them
# nothing. What it is for is the line above -- somebody this service
# serves, whom the owner would not want woken up to approve a write.
