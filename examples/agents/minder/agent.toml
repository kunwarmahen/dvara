# The smallest package that can put work on a timer. `scribe` is the one
# that asks before a write; this one asks before a SCHEDULE, which is a
# write that keeps happening after everybody has gone to bed.
#
# It does nothing on its own. Samay's tools reach it only when the owner
# starts the service with `--samay` (notes/18), and then only for the
# person this turn runs as: one server per turn, `--for` that person, so
# nobody's schedules are one model mistake away from anybody else's.
[agent]
name        = "minder"
description = "Checks a page for you, now or on a schedule you say yes to, and keeps a record if you ask."
version     = "0.2.0"
prompt      = "prompt.md"

[tools]
# web_fetch is the work itself: a read, so it runs without asking, now
# and later. The Samay tools are named by pattern, and an allowlist that
# left them out would hide them however the service was started. Of the
# seven, only create_schedule, pause_schedule, resume_schedule and
# delete_schedule change anything, so only those four become a question.
#
# read_file and write_file are for a record the person asks it to keep
# ("note each time it was down"). Every turn this person has with this
# agent works in ONE folder -- their chat and every run of their
# schedules alike -- so a log a schedule keeps is one they can ask about
# from their phone. Writing in a chat is a question; in a schedule it
# runs only if the card they approved listed it.
#
# send_file sends them the record itself, on Telegram as a document
# (dvara's notes/26). Something leaving for their phone is a write too:
# asked in a chat, and in a schedule only if the card listed it.
allow = ["web_fetch", "read_file", "write_file", "send_file", "mcp__samay__*"]

[env]
# The date and time, from this machine. A record is only as good as its
# timestamps, and an agent that is not told the date makes one up. LOCAL
# ONLY: the clock and the time zone, never the one-off location lookup
# "full" does. Read fresh each turn, since every turn here builds the
# agent again.
context = "local"

[permissions]
# THE PACKAGE MUST ASK. Under "read_only" a schedule is refused without
# asking anybody, which is right for a package that never meant to
# change anything. "ask" is what turns create_schedule into the card the
# person reads on their own channel and answers with a button.
mode = "ask"

[budget]
# One look at a page and a sentence back. A scheduled run is billed to
# the same person's allowance as one they typed.
max_usd_per_turn = 0.05
