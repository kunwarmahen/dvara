[project]
name = "dvara"
version = "0.1.0"
description = "dvara -- the door your agents live behind: one always-on service for many people, many agents and many conversations"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "yantra",
]

[project.scripts]
dvara = "dvara.cli:main"

# The HTTP surface is optional in the same spirit as Yantra's web extra:
# the core is a library you can drive from Python or from `dvara say`,
# and a transport is a thing you add when you want one. FastAPI is the
# same choice Yantra already made for its browser UI, so a machine that
# runs both installs one HTTP stack, not two.
[project.optional-dependencies]
http = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
# Optional for users, mandatory for contributors: tests/test_http.py
# skips its whole module without fastapi, and a suite that quietly runs
# fewer tests is worse than one that fails.
dev = ["pytest>=8.3", "ruff>=0.14", "dvara[http]"]

# Development runs against the checkout next door. Anything reproducible
# pins a git tag instead -- the edge only ever points this way: dvara
# imports Yantra, Yantra never learns dvara exists.
[tool.uv.sources]
yantra = { path = "../yantra", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dvara"]

[tool.ruff]
line-length = 100          # prose wraps near 79; this is the HARD ceiling
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A warning nobody reads is a warning nobody acts on. ResourceWarning as
# an error is what keeps a long-lived service honest about the sockets
# and file descriptors it opens -- which is most of what this repo is.
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:",
]
